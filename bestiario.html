<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Todos os monstros de Empire of Rebirth &amp; Ruins: variantes, elementos, fraquezas, atributos, habilidades e recompensas.">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <meta name="theme-color" content="#1C1C24">
    <!-- Prévia ao compartilhar o link (Discord, WhatsApp, itch.io...). A imagem precisa do endereço completo. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Empire of Rebirth &amp; Ruins">
    <meta property="og:title" content="Bestiário | Empire of Rebirth &amp; Ruins">
    <meta property="og:description" content="Todos os monstros de Empire of Rebirth &amp; Ruins: variantes, elementos, fraquezas, atributos, habilidades e recompensas.">
    <meta property="og:url" content="https://erickotico.github.io/EmpireofRebithandRuins/bestiario.html">
    <meta property="og:image" content="https://erickotico.github.io/EmpireofRebithandRuins/img/share.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Logo de Empire of Rebirth &amp; Ruins">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:locale:alternate" content="en_US">
    <meta name="twitter:card" content="summary_large_image">
    <title data-i18n="bestiary">Bestiary</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/bestiario.css">
</head>
<body>
    <div id="site-header"></div>

    <main class="bestiary-container">
        <h1 class="section-title" data-i18n="bestiary">Bestiary</h1>
        
        <div class="bestiary-filters">
            <div class="search-container">
                <input type="search" id="searchMonster" data-i18n="searchMonster" placeholder="Search monster..." aria-label="Search monster" data-i18n-aria="searchMonster">
                <button id="searchButton" type="button" data-i18n="search">Search</button>
            </div>
            <select id="filterType" aria-label="All types" data-i18n-aria="allTypes">
                <option value="" data-i18n="allTypes">All types</option>
            </select>
            <select id="filterElement" aria-label="All elements" data-i18n-aria="allElements">
                <option value="" data-i18n="allElements">All elements</option>
            </select>
            <label class="toggle-label">
                <input type="checkbox" id="showVariants" checked>
                <span data-i18n="showVariants">Show variants</span>
            </label>
            <span class="monster-count" id="monsterCount" aria-live="polite"></span>
        </div>

        <div class="monster-grid" role="region" aria-label="Bestiary" data-i18n-aria="bestiary"></div>

        <section class="bestiary-section" aria-labelledby="statesTitle">
            <h2 class="section-title" id="statesTitle" data-i18n="monsterStatesTitle">Monster states</h2>
            <p class="section-intro" data-i18n="monsterStatesIntro">These states can appear on many monsters.</p>
            <div class="state-grid" id="monsterStates"></div>
        </section>

        <section class="bestiary-section" aria-labelledby="elementsTitle">
            <h2 class="section-title" id="elementsTitle" data-i18n="elementsTitle">Elements</h2>
            <p class="section-intro" data-i18n="elementsIntro">Each creature has a dominant element.</p>
            <div class="element-grid" id="elementChart"></div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="js/layout.js"></script>
    <script src="js/langSwitcher.js"></script>
    <script src="js/gameData.js"></script>
    <script src="js/bestiario.js"></script>
</body>
</html>
