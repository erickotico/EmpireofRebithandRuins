<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="updatesPageTitle">Updates</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body class="updates-page">
    <div id="site-header"></div>

    <main>
        <section class="updates">
            <h1 class="section-title" data-i18n="allUpdates">All Updates</h1>
            <div class="updates-search">
                <input id="search-updates" type="search" data-i18n="searchUpdates" placeholder="Search updates..." aria-label="Search updates">
            </div>
            <div class="updates-grid" role="region" aria-label="Game updates" data-i18n-aria="gameUpdates" tabindex="0"></div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="js/layout.js"></script>
    <script src="js/langSwitcher.js"></script>
    <script src="js/updates.js"></script>
</body>
</html>
